
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080B19">
<meta name="description" content="ORVEX AI - Intelligence without limits.">
<title>ORVEX AI</title>

<style>
:root {
  --bg:#080B19;
  --surface:#11172B;
  --surface2:#19213B;
  --border:#293252;
  --text:#F4F5FF;
  --muted:#9BA7C4;
  --purple:#8057FF;
  --cyan:#36DDF5;
}
* {box-sizing:border-box}
body {
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
  min-height:100vh;
}
button,input,textarea,select {font:inherit}
button {cursor:pointer}
.hidden {display:none!important}

header {
  height:68px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 20px;
  background:#0C1123;
  border-bottom:1px solid var(--border);
  position:sticky;
  top:0;
  z-index:10;
}
.logo {
  font-size:23px;
  font-weight:900;
  letter-spacing:3px;
  background:linear-gradient(90deg,var(--cyan),var(--purple));
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}
.header-right {display:flex;align-items:center;gap:12px}
#userEmail {font-size:12px;color:var(--muted)}
.secondary-btn {
  background:var(--surface2);
  color:var(--text);
  border:1px solid var(--border);
  border-radius:9px;
  padding:9px 12px;
}
main {
  width:100%;
  max-width:1050px;
  margin:auto;
  padding:22px 16px;
}
.auth-card {
  max-width:420px;
  margin:55px auto;
  padding:28px;
  border:1px solid var(--border);
  border-radius:20px;
  background:var(--surface);
  box-shadow:0 15px 60px #0005;
}
.auth-card h1 {text-align:center;margin:8px 0}
.muted {color:var(--muted);text-align:center;font-size:14px}
.field {margin:18px 0}
.field label {
  display:block;
  color:var(--muted);
  font-size:13px;
  margin-bottom:8px;
}
.field input {
  width:100%;
  padding:14px;
  border:1px solid var(--border);
  border-radius:10px;
  background:#090F20;
  color:white;
  outline:none;
}
.field input:focus {border-color:var(--cyan)}
.primary-btn {
  border:0;
  border-radius:11px;
  padding:14px;
  width:100%;
  color:#080B19;
  font-weight:800;
  background:linear-gradient(100deg,var(--cyan),#A18AFF);
}
.primary-btn:disabled {opacity:.5}
.switch-line {
  text-align:center;
  color:var(--muted);
  font-size:13px;
  margin-top:20px;
}
.text-btn {
  background:none;
  border:0;
  color:var(--cyan);
  font-weight:bold;
}
.notice {
  min-height:20px;
  color:var(--cyan);
  font-size:13px;
  text-align:center;
  margin-top:12px;
  overflow-wrap:anywhere;
}
.hero {
  text-align:center;
  padding:55px 10px 35px;
}
.hero-mark {
  font-size:45px;
  font-weight:900;
  letter-spacing:7px;
  background:linear-gradient(90deg,var(--cyan),var(--purple));
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}
.hero h1 {font-size:32px;margin:16px 0 10px}
.hero p {color:var(--muted);font-size:14px}
.suggestions {
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:12px;
  max-width:650px;
  margin:25px auto;
}
.suggestion {
  background:var(--surface);
  color:var(--text);
  border:1px solid var(--border);
  padding:15px;
  border-radius:12px;
  text-align:left;
}
.suggestion:hover {border-color:var(--purple)}
.chat-list {
  display:flex;
  flex-direction:column;
  gap:16px;
  padding:10px 0 30px;
}
.message {
  max-width:88%;
  padding:15px;
  border-radius:15px;
  line-height:1.65;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}
.message.user {
  align-self:flex-end;
  background:#28264D;
  border:1px solid #51458B;
}
.message.assistant {
  align-self:flex-start;
  background:var(--surface);
  border:1px solid var(--border);
}
.message-name {
  font-size:11px;
  font-weight:bold;
  color:var(--cyan);
  margin-bottom:7px;
  letter-spacing:1px;
}
.message img {
  display:block;
  max-width:100%;
  max-height:320px;
  border-radius:10px;
  margin-top:10px;
}
.composer {
  position:sticky;
  bottom:0;
  padding:12px 0 18px;
  background:var(--bg);
}
.composer-box {
  padding:12px;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:16px;
}
#promptInput {
  display:block;
  width:100%;
  min-height:65px;
  max-height:180px;
  resize:vertical;
  padding:10px;
  color:white;
  background:transparent;
  border:0;
  outline:none;
}
.composer-tools {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  flex-wrap:wrap;
}
.tool-group {display:flex;align-items:center;gap:8px;flex-wrap:wrap}
#mode {
  max-width:180px;
  padding:10px;
  background:#0B1022;
  border:1px solid var(--border);
  color:white;
  border-radius:9px;
}
.attach-btn {
  display:inline-block;
  padding:10px 12px;
  background:var(--surface2);
  border-radius:9px;
  color:var(--cyan);
  font-size:13px;
}
#imageInput {display:none}
#sendBtn {
  border:0;
  border-radius:10px;
  padding:11px 20px;
  background:linear-gradient(100deg,var(--cyan),#A18AFF);
  color:#080B19;
  font-weight:800;
}
#sendBtn:disabled {opacity:.5}
#previewArea img {
  max-width:100px;
  max-height:100px;
  border-radius:10px;
  margin:5px;
}
.footer {
  text-align:center;
  padding:20px 10px;
  color:#77829F;
  font-size:11px;
}
@media(max-width:550px) {
  header {padding:0 12px}
  .logo {font-size:19px}
  #userEmail {display:none}
  main {padding:14px 10px}
  .hero {padding-top:35px}
  .hero h1 {font-size:25px}
  .message {max-width:95%}
  .suggestions {gap:8px}
  .suggestion {font-size:12px;padding:12px}
}
</style>
</head>

<body>

<header>
  <div class="logo">ORVEX</div>
  <div class="header-right">
    <span id="userEmail"></span>
    <button id="logoutBtn" class="secondary-btn hidden" type="button">Log out</button>
  </div>
</header>

<main>

<section id="authSection" class="auth-card">
  <h1 id="authTitle">Welcome to ORVEX</h1>
  <p id="authSubtitle" class="muted">Your intelligent AI workspace.</p>

  <form id="authForm">
    <div class="field">
      <label for="email">Email address</label>
      <input id="email" type="email" autocomplete="email" required>
    </div>

    <div class="field">
      <label for="password">Password</label>
      <input id="password" type="password" minlength="6" autocomplete="current-password" required>
    </div>

    <button id="authSubmit" class="primary-btn" type="submit">Log In</button>
  </form>

  <div class="switch-line">
    <span id="switchText">Don't have an account?</span>
    <button id="switchAuth" class="text-btn" type="button">Create account</button>
  </div>

  <div id="authNotice" class="notice" role="status"></div>
</section>

<section id="chatSection" class="hidden">

  <div id="welcome" class="hero">
    <div class="hero-mark">ORVEX</div>
    <h1>Intelligence. Without limits.</h1>
    <p>What would you like to explore today?</p>

    <div class="suggestions">
      <button class="suggestion" type="button" data-prompt="Explain a difficult topic in simple words.">Learn something new</button>
      <button class="suggestion" type="button" data-prompt="Help me research this topic.">Research and discover</button>
      <button class="suggestion" type="button" data-prompt="Help me write something professional.">Write and create</button>
      <button class="suggestion" type="button" data-prompt="Help me solve this problem step by step.">Solve a problem</button>
    </div>
  </div>

  <div id="chatList" class="chat-list"></div>

  <div class="composer">
    <div class="composer-box">
      <textarea id="promptInput" placeholder="Message ORVEX AI..." rows="2"></textarea>

      <div id="previewArea"></div>

      <div class="composer-tools">
        <div class="tool-group">
          <select id="mode" aria-label="Choose AI mode">
            <option value="chat">AI Chat</option>
            <option value="analyze_image">Understand Image</option>
            <option value="generate_image">Generate Image</option>
            <option value="edit_image">Edit Image</option>
          </select>

          <label class="attach-btn" for="imageInput">＋ Image</label>
          <input id="imageInput" type="file" accept="image/*">
        </div>

        <button id="sendBtn" type="button">Send ↗</button>
      </div>
    </div>
    <div id="chatNotice" class="notice" role="status"></div>
  </div>

</section>

</main>

<div class="footer">
  ORVEX AI · Created by OYETADE MAYOWA AYOMIDE
</div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>

<script>
"use strict";

/* Keep the existing Firebase project so current accounts remain valid. */
const firebaseConfig = {
  apiKey: "AIzaSyD4oCtqtD8U1wnErSP10iu2sIr0XzaqrQs",
  authDomain: "orvex-ai-f4bb3.firebaseapp.com",
  projectId: "orvex-ai-f4bb3",
  storageBucket: "orvex-ai-f4bb3.firebasestorage.app",
  messagingSenderId: "330308895814",
  appId: "1:330308895814:web:88c727af7b07ce5fd4b647",
  measurementId: "G-CZEGRQQ5R4"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();

const elements = {
  authSection: document.getElementById("authSection"),
  chatSection: document.getElementById("chatSection"),
  authForm: document.getElementById("authForm"),
  authTitle: document.getElementById("authTitle"),
  authSubtitle: document.getElementById("authSubtitle"),
  authSubmit: document.getElementById("authSubmit"),
  switchAuth: document.getElementById("switchAuth"),
  switchText: document.getElementById("switchText"),
  authNotice: document.getElementById("authNotice"),
  chatNotice: document.getElementById("chatNotice"),
  userEmail: document.getElementById("userEmail"),
  logoutBtn: document.getElementById("logoutBtn"),
  welcome: document.getElementById("welcome"),
  chatList: document.getElementById("chatList"),
  promptInput: document.getElementById("promptInput"),
  sendBtn: document.getElementById("sendBtn"),
  mode: document.getElementById("mode"),
  imageInput: document.getElementById("imageInput"),
  previewArea: document.getElementById("previewArea")
};

let isRegistering = false;
let isSending = false;
let currentUser = null;
let selectedImage = null;
let conversation = [];

function showNotice(element, message) {
  element.textContent = message || "";
}

function storageKey(uid) {
  return "orvex_conversation_" + uid;
}

function loadHistory(uid) {
  try {
    const saved = localStorage.getItem(storageKey(uid));
    conversation = saved ? JSON.parse(saved) : [];

    if (!Array.isArray(conversation)) {
      conversation = [];
    }
  } catch (error) {
    conversation = [];
  }

  renderHistory();
}

function saveHistory() {
  if (!currentUser) return;

  try {
    localStorage.setItem(
      storageKey(currentUser.uid),
      JSON.stringify(conversation.slice(-100))
    );
  } catch (error) {
    showNotice(elements.chatNotice, "Chat history could not be saved on this device.");
  }
}

function addMessage(role, text, image) {
  conversation.push({
    role: role,
    text: text || "",
    image: image || ""
  });

  saveHistory();
  renderHistory();
}

function renderHistory() {
  elements.chatList.replaceChildren();

  elements.welcome.classList.toggle(
    "hidden",
    conversation.length > 0
  );

  conversation.forEach(function(item) {
    const bubble = document.createElement("div");
    bubble.className = "message " +
      (item.role === "user" ? "user" : "assistant");

    const heading = document.createElement("div");
    heading.className = "message-name";
    heading.textContent = item.role === "user" ? "YOU" : "ORVEX AI";
    bubble.appendChild(heading);

    if (item.text) {
      const text = document.createElement("div");
      text.textContent = item.text;
      bubble.appendChild(text);
    }

    if (item.image) {
      const image = document.createElement("img");
      image.src = item.image;
      image.alt = "Conversation image";
      bubble.appendChild(image);
    }

    elements.chatList.appendChild(bubble);
  });
}

function showAuthenticatedApp(user) {
  currentUser = user;

  elements.authSection.classList.add("hidden");
  elements.chatSection.classList.remove("hidden");
  elements.logoutBtn.classList.remove("hidden");
  elements.userEmail.textContent = user.email || "";

  loadHistory(user.uid);
}

function showLoginScreen() {
  currentUser = null;
  conversation = [];

  elements.chatSection.classList.add("hidden");
  elements.authSection.classList.remove("hidden");
  elements.logoutBtn.classList.add("hidden");
  elements.userEmail.textContent = "";

  showNotice(elements.authNotice, "");
  showNotice(elements.chatNotice, "");
}

function updateAuthMode() {
  isRegistering = !isRegistering;

  if (isRegistering) {
    elements.authTitle.textContent = "Create your account";
    elements.authSubtitle.textContent = "Join the ORVEX AI community.";
    elements.authSubmit.textContent = "Create Account";
    elements.switchText.textContent = "Already have an account?";
    elements.switchAuth.textContent = "Log in";
    document.getElementById("password").autocomplete = "new-password";
  } else {
    elements.authTitle.textContent = "Welcome to ORVEX";
    elements.authSubtitle.textContent = "Your intelligent AI workspace.";
    elements.authSubmit.textContent = "Log In";
    elements.switchText.textContent = "Don't have an account?";
    elements.switchAuth.textContent = "Create account";
    document.getElementById("password").autocomplete = "current-password";
  }

  showNotice(elements.authNotice, "");
}

elements.switchAuth.addEventListener("click", updateAuthMode);

elements.authForm.addEventListener("submit", async function(event) {
  event.preventDefault();

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  if (!email || !password) {
    showNotice(elements.authNotice, "Enter your email and password.");
    return;
  }

  elements.authSubmit.disabled = true;
  elements.authSubmit.textContent = "Please wait...";
  showNotice(elements.authNotice, "");

  try {
    if (isRegistering) {
      await auth.createUserWithEmailAndPassword(email, password);
    } else {
      await auth.signInWithEmailAndPassword(email, password);
    }
  } catch (error) {
    const messages = {
      "auth/email-already-in-use": "This email already has an account. Please log in.",
      "auth/invalid-email": "Enter a valid email address.",
      "auth/weak-password": "Your password must contain at least 6 characters.",
      "auth/user-not-found": "No account was found with this email.",
      "auth/wrong-password": "The password is incorrect.",
      "auth/invalid-credential": "Incorrect email or password.",
      "auth/network-request-failed": "Network error. Check your internet connection.",
      "auth/too-many-requests": "Too many attempts. Please try again later."
    };

    showNotice(
      elements.authNotice,
      messages[error.code] || error.message || "Authentication failed."
    );
  } finally {
    elements.authSubmit.disabled = false;
    elements.authSubmit.textContent = isRegistering ? "Create Account" : "Log In";
  }
});

elements.logoutBtn.addEventListener("click", async function() {
  try {
    await auth.signOut();
  } catch (error) {
    showNotice(elements.chatNotice, "Could not log out. Please try again.");
  }
});

auth.onAuthStateChanged(function(user) {
  if (user) {
    showAuthenticatedApp(user);
  } else {
    showLoginScreen();
  }
});

elements.imageInput.addEventListener("change", function() {
  const file = elements.imageInput.files &&
    elements.imageInput.files[0];

  selectedImage = null;
  elements.previewArea.replaceChildren();

  if (!file) return;

  if (!file.type.startsWith("image/")) {
    showNotice(elements.chatNotice, "Please select an image.");
    elements.imageInput.value = "";
    return;
  }

  if (file.size > 5 * 1024 * 1024) {
    showNotice(elements.chatNotice, "Choose an image smaller than 5 MB.");
    elements.imageInput.value = "";
    return;
  }

  const reader = new FileReader();

  reader.onload = function() {
    selectedImage = reader.result;

    const preview = document.createElement("img");
    preview.src = selectedImage;
    preview.alt = "Image preview";

    elements.previewArea.appendChild(preview);
    showNotice(elements.chatNotice, "Image attached.");
  };

  reader.onerror = function() {
    showNotice(elements.chatNotice, "Could not read the image.");
  };

  reader.readAsDataURL(file);
});

async function sendMessage() {
  if (isSending) return;

  if (!auth.currentUser) {
    showNotice(elements.chatNotice, "Please log in first.");
    return;
  }

  const message = elements.promptInput.value.trim();
  const mode = elements.mode.value;

  if (!message && !selectedImage && mode !== "generate_image") {
    showNotice(elements.chatNotice, "Type a message or attach an image.");
    return;
  }

  if ((mode === "analyze_image" || mode === "edit_image") && !selectedImage) {
    showNotice(elements.chatNotice, "Attach an image first.");
    return;
  }

  const imageForMessage = selectedImage;
  const textForMessage = message ||
    (mode === "generate_image" ? "Generate an image." : "Examine this image.");

  isSending = true;
  elements.sendBtn.disabled = true;
  elements.sendBtn.textContent = "Working...";
  showNotice(elements.chatNotice, "ORVEX is connecting...");

  addMessage("user", textForMessage, imageForMessage);

  elements.promptInput.value = "";
  elements.previewArea.replaceChildren();
  elements.imageInput.value = "";
  selectedImage = null;

  try {
    const token = await auth.currentUser.getIdToken();

    const response = await fetch("/api/chat", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": "Bearer " + token
      },
      body: JSON.stringify({
        message: textForMessage,
        mode: mode,
        image: imageForMessage,
        history: conversation.slice(-20).map(function(item) {
          return {
            role: item.role,
            content: item.text
          };
        })
      })
    });

    let data;

    try {
      data = await response.json();
    } catch (error) {
      throw new Error("The server returned an invalid response.");
    }

    if (!response.ok) {
      throw new Error(data.error || "The AI request failed.");
    }

    const answer = data.reply || data.answer || data.text;

    if (answer) {
      addMessage("assistant", answer, data.imageUrl || "");
    } else if (data.imageUrl) {
      addMessage("assistant", "Your image is ready.", data.imageUrl);
    } else {
      throw new Error("The AI returned an empty response.");
    }

    showNotice(elements.chatNotice, "");
  } catch (error) {
    addMessage(
      "assistant",
      "I couldn't complete that request. " +
      (error.message || "Please try again.")
    );

    showNotice(elements.chatNotice, error.message || "Connection failed.");
  } finally {
    isSending = false;
    elements.sendBtn.disabled = false;
    elements.sendBtn.textContent = "Send ↗";
  }
}

elements.sendBtn.addEventListener("click", sendMessage);

elements.promptInput.addEventListener("keydown", function(event) {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    sendMessage();
  }
});

document.querySelectorAll(".suggestion").forEach(function(button) {
  button.addEventListener("click", function() {
    elements.promptInput.value = button.dataset.prompt || "";
    elements.promptInput.focus();
  });
});
</script>

</body>
  </html>
