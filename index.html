  projectId: "orvex-ai-f4bb3",
  storageBucket: "orvex-ai-f4bb3.firebasestorage.app",

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();

let currentChatId = null;
let conversationHistory = [];
let selectedImage = null;
let selectedImageUrl = null;
let isSending = false;

const authSection = document.getElementById("authSection");
const appSection = document.getElementById("appSection");
const authStatus = document.getElementById("authStatus");
const messages = document.getElementById("messages");
const promptInput = document.getElementById("prompt");
const sendBtn = document.getElementById("sendBtn");
const notice = document.getElementById("notice");

function setAuthStatus(message, error = true) {
  authStatus.style.color = error ? "#fca5a5" : "#86efac";
  authStatus.textContent = message;
}

async function createAccount() {
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  if (!email || !password) {
    setAuthStatus("Enter your email and password.");
    return;
  }

  if (password.length < 6) {
    setAuthStatus("Your password must contain at least 6 characters.");
    return;
  }

  try {
    setAuthStatus("Creating your account...", false);
    await auth.createUserWithEmailAndPassword(email, password);
    setAuthStatus("Account created successfully!", false);
  } catch (error) {
    setAuthStatus(error.message);
  }
}

async function login() {
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  if (!email || !password) {
    setAuthStatus("Enter your email and password.");
    return;
  }

  try {
    setAuthStatus("Logging in...", false);
    await auth.signInWithEmailAndPassword(email, password);
  } catch (error) {
    setAuthStatus(error.message);
  }
}

async function logout() {
  stopSpeaking();
  await auth.signOut();
}

auth.onAuthStateChanged(async user => {
  if (user) {
    authSection.classList.add("hidden");
    appSection.classList.remove("hidden");
    document.getElementById("logoutBtn").classList.remove("hidden");

    const label = document.getElementById("userLabel");
    label.textContent = user.email;
    label.classList.remove("hidden");

    await loadChatHistory();

    if (!currentChatId) {
      newChat();
    }
  } else {
    authSection.classList.remove("hidden");
    appSection.classList.add("hidden");
    document.getElementById("logoutBtn").classList.add("hidden");
    document.getElementById("userLabel").classList.add("hidden");
  }
});

function newChat() {
  currentChatId = null;
  conversationHistory = [];
  clearImagePreview();

  messages.innerHTML = `
    <div class="welcome" id="welcome">
      <h1>Welcome to ORVEX AI</h1>
      <p>Your intelligent AI assistant. Ask questions, upload images, or use your voice.</p>
      <div class="features">
        <div class="feature">💬 AI Conversations</div>
        <div class="feature">🖼️ Image Understanding</div>
        <div class="feature">🎨 Image Generation</div>
        <div class="feature">🎙️ Voice Assistant</div>
      </div>
    </div>
  `;

  promptInput.value = "";
  notice.textContent = "New conversation started.";
}

function clearChat() {
  newChat();
}

function formatAnswer(text) {
  const escaped = String(text || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");

  const lines = escaped.split("\n");
  let html = "";
  let inList = false;
  let listType = "";

  function closeList() {
    if (inList) {
      html += listType === "ol" ? "</ol>" : "</ul>";
      inList = false;
      listType = "";
    }
  }

  for (const rawLine of lines) {
    const line = rawLine.trim();

    if (!line) {
      closeList();
      continue;
    }

    const heading = line.match(/^#{1,3}\s+(.+)/);

    if (heading) {
      closeList();
      html += `<h3>${heading[1]}</h3>`;
      continue;
    }

    const numbered = line.match(/^\d+[\.)]\s+(.+)/);
    const bullet = line.match(/^[-*•]\s+(.+)/);

    if (numbered || bullet) {
      const type = numbered ? "ol" : "ul";

      if (!inList || listType !== type) {
        closeList();
        html += type === "ol" ? "<ol>" : "<ul>";
        inList = true;
        listType = type;
      }

      html += `<li>${numbered ? numbered[1] : bullet[1]}</li>`;
      continue;
    }

    closeList();

    const formatted = line.replace(
      /\*\*(.*?)\*\*/g,
      "<strong>$1</strong>"
    );

    html += `<p>${formatted}</p>`;
  }

  closeList();

  return `<div class="formatted-answer">${html}</div>`;
}

function addMessage(role, text, imageUrl = null) {
  const welcome = document.getElementById("welcome");
  if (welcome) welcome.remove();

  const message = document.createElement("div");
  message.className = `message ${role}`;

  const roleLabel = document.createElement("div");
  roleLabel.className = "role";
  roleLabel.textContent = role === "user" ? "YOU" : "ORVEX AI";

  const content = document.createElement("div");

  if (role === "assistant") {
    content.innerHTML = formatAnswer(text);
  } else {
    content.textContent = text || "";
  }

  message.appendChild(roleLabel);
  message.appendChild(content);

  if (imageUrl) {
    const img = document.createElement("img");
    img.src = imageUrl;
    img.alt = "Attached or generated image";
    message.appendChild(img);
  }

  if (role === "assistant") {
    const actions = document.createElement("div");
    actions.className = "message-actions";

    const speakButton = document.createElement("button");
    speakButton.type = "button";
    speakButton.textContent = "🔊 Read aloud";
    speakButton.onclick = () => speakText(text);

    actions.appendChild(speakButton);
    message.appendChild(actions);
  }

  messages.appendChild(message);
  messages.scrollTop = messages.scrollHeight;

  return message;
}

async function loadChatHistory() {
  if (!auth.currentUser) return;

  try {
    const snapshot = await db.collection("users")
      .doc(auth.currentUser.uid)
      .collection("chats")
      .orderBy("updatedAt", "desc")
      .limit(30)
      .get();

    const historyList = document.getElementById("historyList");
    historyList.innerHTML = "";

    snapshot.forEach(doc => {
      const data = doc.data();
      const button = document.createElement("button");

      button.className = "history-item";
      button.textContent = data.title || "New conversation";
      button.onclick = () => openChat(doc.id);

      historyList.appendChild(button);
    });
  } catch (error) {
    console.error("History loading error:", error);
  }
}

async function saveConversation() {
  if (!auth.currentUser || conversationHistory.length === 0) return;

  if (!currentChatId) {
    currentChatId = db.collection("users")
      .doc(auth.currentUser.uid)
      .collection("chats")
      .doc().id;
  }

  const firstMessage = conversationHistory.find(
    item => item.role === "user"
  );

  const title = firstMessage
    ? firstMessage.parts?.[0]?.text?.slice(0, 45) || "New conversation"
    : "New conversation";

  try {
    await db.collection("users")
      .doc(auth.currentUser.uid)
      .collection("chats")
      .doc(currentChatId)
      .set({
        title,
        messages: conversationHistory,
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      }, { merge: true });

    await loadChatHistory();
  } catch (error) {
    console.error("Conversation save error:", error);
    notice.textContent = "Could not save conversation history.";
  }
}

async function openChat(chatId) {
  if (!auth.currentUser) return;

  try {
    const doc = await db.collection("users")
      .doc(auth.currentUser.uid)
      .collection("chats")
      .doc(chatId)
      .get();

    if (!doc.exists) return;

    currentChatId = chatId;
    conversationHistory = doc.data().messages || [];

    clearImagePreview();
    messages.innerHTML = "";

    conversationHistory.forEach(item => {
      const text = item.parts?.map(part => part.text || "").join("") || "";
      const role = item.role === "user" ? "user" : "assistant";

      addMessage(role, text);
    });

    notice.textContent = "Conversation loaded.";
  } catch (error) {
    console.error("Open chat error:", error);
    notice.textContent = "Could not open this conversation.";
  }
}

document.getElementById("imageInput").addEventListener("change", async event => {
  const file = event.target.files[0];

  if (!file) return;

  if (!["image/jpeg", "image/png", "image/webp"].includes(file.type)) {
    notice.textContent = "Please choose a JPG, PNG, or WEBP image.";
    event.target.value = "";
    return;
  }

  if (file.size > 8 * 1024 * 1024) {
    notice.textContent = "Please choose an image smaller than 8 MB.";
    event.target.value = "";
    return;
  }

  try {
    selectedImage = await compressImage(file);
    selectedImageUrl = URL.createObjectURL(file);

    showImagePreview(selectedImageUrl);
    notice.textContent = "Image attached.";
  } catch (error) {
    console.error(error);
    notice.textContent = "Could not load that image.";
  }
});

function compressImage(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();

    reader.onload = () => {
      const img = new Image();

      img.onload = () => {
        const maxSize = 1200;
        const scale = Math.min(
          1,
          maxSize / Math.max(img.width, img.height)
        );

        const canvas = document.createElement("canvas");

        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);

        const context = canvas.getContext("2d");
        context.drawImage(img, 0, 0, canvas.width, canvas.height);

        const dataUrl = canvas.toDataURL("image/jpeg", 0.82);

        resolve({
          data: dataUrl.split(",")[1],
          mimeType: "image/jpeg"
        });
      };

      img.onerror = reject;
      img.src = reader.result;
    };

    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function showImagePreview(url) {
  const preview = document.getElementById("imagePreview");
  preview.innerHTML = "";

  const img = document.createElement("img");
  img.src = url;

  const label = document.createElement("span");
  label.textContent = "Image attached";

  const remove = document.createElement("button");
  remove.type = "button";
  remove.textContent = "Remove";
  remove.onclick = clearImagePreview;

  preview.append(img, label, remove);
  preview.classList.remove("hidden");
}

function clearImagePreview() {
  const preview = document.getElementById("imagePreview");
  preview.innerHTML = "";
  preview.classList.add("hidden");

  if (selectedImageUrl) {
    URL.revokeObjectURL(selectedImageUrl);
  }

  selectedImage = null;
  selectedImageUrl = null;

  document.getElementById("imageInput").value = "";
}

async function sendMessage() {
  if (isSending) return;

  const message = promptInput.value.trim();
  const mode = document.getElementById("mode").value;

  if (!message && !selectedImage && mode !== "generate_image") {
    notice.textContent = "Type a message or attach an image.";
    return;
  }

  if (!auth.currentUser) {
    notice.textContent = "Please log in first.";
    return;
  }

  isSending = true;
  sendBtn.disabled = true;
  notice.textContent = "ORVEX is thinking...";

  const imageData = selectedImage;

  const imageForMessage = imageData
    ? `data:${imageData.mimeType};base64,${imageData.data}`
    : null;

  const userText = message || (
    mode === "generate_image"
      ? "Generate an image."
      : "Please examine this image."
  );

  addMessage("user", userText, imageForMessage);

  promptInput.value = "";
  clearImagePreview();

  const historyForRequest = conversationHistory.slice(-12);

  try {
    const response = await fetch("/.netlify/functions/chat", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        message: userText,
        history: historyForRequest,
        image: imageData,
        action: mode
      })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(
        data.error || data.message || "The AI request failed."
      );
    }

    const answer = data.answer || "I couldn't generate a response.";

    const generatedImageUrl = data.image?.data
      ? `data:${data.image.mimeType || "image/png"};base64,${data.image.data}`
      : null;

    addMessage("assistant", answer, generatedImageUrl);

    conversationHistory.push(
      { role: "user", parts: [{ text: userText }] },
      { role: "model", parts: [{ text: answer }] }
    );

    await saveConversation();

    notice.textContent = "ORVEX is ready.";
  } catch (error) {
    console.error("Chat error:", error);

    addMessage(
      "assistant",
      "Sorry, I couldn't complete that request.\n\n" + error.message
    );

    notice.textContent = "Request failed.";
  } finally {
    isSending = false;
    sendBtn.disabled = false;
    promptInput.focus();
  }
}

promptInput.addEventListener("keydown", event => {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    sendMessage();
  }
});

function startVoiceInput() {
  const SpeechRecognition =
    window.SpeechRecognition || window.webkitSpeechRecognition;

  if (!SpeechRecognition) {
    notice.textContent = "Voice input is not supported by this browser. Try Chrome.";
    return;
  }

  const recognition = new SpeechRecognition();

  recognition.lang = "en-US";
  recognition.continuous = false;
  recognition.interimResults = false;

  notice.textContent = "Listening... Speak now.";

  recognition.onresult = event => {
    const spokenText = event.results[0][0].transcript;

    promptInput.value = (
      promptInput.value + " " + spokenText
    ).trim();

    notice.textContent = "Voice message added. Press Send.";
  };

  recognition.onerror = event => {
    notice.textContent = "Voice input error: " + event.error;
  };

  recognition.onend = () => {
    if (notice.textContent === "Listening... Speak now.") {
      notice.textContent = "Voice input ended.";
    }
  };

  recognition.start();
}

function speakText(text) {
  if (!("speechSynthesis" in window)) {
    notice.textContent = "Voice output is not supported by this browser.";
    return;
  }

  stopSpeaking();

  const utterance = new SpeechSynthesisUtterance(text);

  utterance.lang = "en-US";
  utterance.rate = 1;
  utterance.pitch = 1;

  window.speechSynthesis.speak(utterance);
}

function stopSpeaking() {
  if ("speechSynthesis" in window) {
    window.speechSynthesis.cancel();
  }
}
